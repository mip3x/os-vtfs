name: Test VT File System

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'vtfs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vtfs
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) clang-format

      - name: Clang Format
        run: |
          find . -path ./build -prune -o \
            \( -iname '*.c' -o -iname '*.h' -o -iname '*.cpp' -o -iname '*.hpp' \) \
            -exec clang-format --style=file --dry-run --verbose {} \;

      - name: Build
        run: make
